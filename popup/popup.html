<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEANar Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-dark">
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-badge">
        <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4-4 10-10 6 6-6 6H7Z"/><path d="M21 21H7"/><path d="m13 7 6 6"/>
        </svg>
        <span class="brand-title">CLEANar</span>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-action-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="openOptionsBtn" class="icon-action-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Metrics Stage -->
    <section class="metrics-stage">
      <div class="metric-block">
        <div id="statMB" class="metric-value">0.0</div>
        <div class="metric-label">MB Reclaimed</div>
      </div>
      <div class="metric-separator"></div>
      <div class="metric-block">
        <div id="statItems" class="metric-value">0</div>
        <div class="metric-label">Items Purged</div>
      </div>
    </section>

    <!-- Trigger Action Button -->
    <div class="action-hero">
      <button id="cleanNowBtn" class="primary-clean-btn">
        <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4-4 10-10 6 6-6 6H7Z"/><path d="M21 21H7"/><path d="m13 7 6 6"/>
        </svg>
        <span class="btn-caption">ERASE NOW</span>
      </button>
      <div id="cleanStatusText" class="status-indicator">Ready to erase</div>
    </div>

    <!-- Controls Toolbar -->
    <div class="controls-toolbar">
      <label for="timeRangeSelect" class="toolbar-label">Period:</label>
      <select id="timeRangeSelect" class="sleek-select">
        <option value="1h">Last Hour</option>
        <option value="24h">Last 24 Hours</option>
        <option value="7d">Last 7 Days</option>
        <option value="4w">Last 4 Weeks</option>
        <option value="all">All Time</option>
      </select>
    </div>

    <!-- Whitelist Site Controller -->
    <div class="site-protection-bar">
      <div class="domain-info">
        <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="currentDomainLabel" class="domain-text">detecting domain...</span>
      </div>
      <button id="quickWhitelistBtn" class="shield-toggle-btn">
        <svg class="shield-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span id="whitelistBtnText">Protect</span>
      </button>
    </div>

    <!-- Category Grid Matrix -->
    <div class="category-matrix">
      <label class="matrix-card">
        <input type="checkbox" id="chkCache">
        <div class="card-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          <span>Cache</span>
        </div>
      </label>
      <label class="matrix-card">
        <input type="checkbox" id="chkHistory">
        <div class="card-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>History</span>
        </div>
      </label>
      <label class="matrix-card">
        <input type="checkbox" id="chkCookies">
        <div class="card-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5z"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/><circle cx="9" cy="15" r="1"/></svg>
          <span>Cookies</span>
        </div>
      </label>
      <label class="matrix-card">
        <input type="checkbox" id="chkDownloads">
        <div class="card-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Downloads</span>
        </div>
      </label>
      <label class="matrix-card">
        <input type="checkbox" id="chkFormData">
        <div class="card-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Forms</span>
        </div>
      </label>
      <label class="matrix-card">
        <input type="checkbox" id="chkLocalStorage">
        <div class="card-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <span>Storage</span>
        </div>
      </label>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
